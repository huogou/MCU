<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCU 观影导航 - 漫威电影观看顺序与观影路线规划</title>
<meta name="description" content="从第一部《钢铁侠》到未来 MCU 作品，帮你找到属于自己的观看路线。提供 11 条观影路线、上映预告、电影资料库与观影进度记录。">
<meta name="keywords" content="漫威观影导航,漫威电影观看顺序,MCU时间线,漫威电影上映顺序,MCU观影路线">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/v2.css">
</head>
<body>

<div id="app-nav"></div>

<main class="v2">

  <!-- ============ 1. HERO ============ -->
  <section class="v2-hero" data-section-label="首页">
    <div class="v2-hero-bg" aria-hidden="true"></div>
    <div class="v2-hero-stars" aria-hidden="true" id="v2-stars"></div>
    <div class="v2-hero-inner">
      <span class="v2-hero-badge"><i></i>MCU 观影导航</span>
      <h1 class="v2-hero-title">漫威观影导航</h1>
      <p class="v2-hero-sub">从第一部钢铁侠，到未来 MCU 作品，帮你找到属于自己的观看路线。</p>
      <div class="v2-hero-actions">
        <a class="v2-btn v2-btn-primary" href="routes.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          规划路线
        </a>
        <a class="v2-btn v2-btn-ghost" href="routes.html?r=chrono">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
          查看时间线
        </a>
      </div>
      <div class="v2-hero-stats">
        <div class="v2-stat"><b id="stat-count">—</b><span>部内容 · 电影 · 剧集 · 短片</span></div>
        <div class="v2-stat"><b id="stat-routes">—</b><span>条路线</span></div>
        <div class="v2-stat"><b id="stat-phases">—</b><span>个叙事阶段</span></div>
      </div>
    </div>
  </section>

  <!-- ============ 2. 观影路线 ============ -->
  <section class="v2-section" id="v2-routes" data-section-label="观影路线">
    <div class="v2-inner">
      <div id="routes-title"></div>
      <div class="v2-pills" id="route-pills"></div>
      <div class="v2-rail" id="route-rail"></div>
      <a class="v2-more" id="route-more" href="route-detail.html?id=newcomer">查看这条完整路线 →</a>
    </div>
  </section>

  <div class="v2-rule"></div>

  <!-- ============ 3. 上映预告（漫威未来计划） ============ -->
  <section class="v2-section" id="v2-upcoming" data-section-label="漫威未来计划">
    <div class="v2-inner">
      <div id="upcoming-title"></div>
      <div class="v2-tl" id="upcoming-timeline"></div>
    </div>
  </section>

  <div class="v2-rule"></div>

  <!-- ============ 4. 电影资料库 ============ -->
  <section class="v2-section" id="v2-library" data-section-label="电影资料库">
    <div class="v2-inner">
      <div id="library-title"></div>
      <div class="v2-pills" id="phase-pills"></div>
      <div class="v2-pills v2-pills--sub" id="type-pills"></div>
      <div class="v2-grid" id="library-grid"></div>
      <button class="v2-more" id="library-more" type="button" hidden></button>
    </div>
  </section>

  <div class="v2-rule"></div>

  <!-- ============ 5. 我的 MCU ============ -->
  <section class="v2-section" id="v2-mine" data-section-label="我的 MCU">
    <div class="v2-inner">
      <div id="mine-title"></div>
      <div id="progress-card"></div>
      <div id="seen-slot"></div>
      <div id="ach-slot"></div>
      <div id="milestone-slot"></div>
    </div>
  </section>

  <div class="v2-rule"></div>

  <!-- ============ 6. 社区入口（预留，不可交互） ============ -->
  <section class="v2-section" id="v2-community-sec" data-section-label="社区">
    <div class="v2-inner">
      <div id="community-title"></div>
      <div id="community-slot"></div>
    </div>
  </section>

  <!-- ============ 7. 快捷入口 + 小程序入口 ============ -->
  <section class="v2-section" id="v2-entry" data-section-label="小程序">
    <div class="v2-inner">
      <div class="v2-quick">
        <a class="v2-quick-item" href="next.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"/></svg>
          <span><b>下一部看什么</b><span>告诉我你看到哪了</span></span>
        </a>
        <a class="v2-quick-item" href="map.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M12 18v4M2 12h4M18 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
          <span><b>宇宙关系地图</b><span>看清作品之间的关联</span></span>
        </a>
      </div>

      <div class="v2-mp" style="margin-top:14px">
        <div class="v2-mp-title">在小程序里继续</div>
        <div class="v2-mp-desc">记录已看作品、保存观影路线，换设备也能接着看。</div>
        <div class="v2-mp-btns">
          <button class="v2-mp-btn v2-mp-btn--wechat" type="button"
                  data-mp-title="MCU 观影导航 · 微信小程序"
                  data-mp-desc="记录进度 · 保存路线 · 生成你的 MCU 档案">微信小程序</button>
          <button class="v2-mp-btn v2-mp-btn--douyin" type="button"
                  data-mp-title="MCU 观影导航 · 抖音小程序"
                  data-mp-desc="记录进度 · 保存路线 · 生成你的 MCU 档案">抖音小程序</button>
        </div>
      </div>
    </div>
  </section>

</main>

<div id="app-foot"></div>

<script src="data/movies.js"></script>
<script src="data/upcoming.js"></script>
<script src="data/relations.js"></script>
<script src="data/routes.js"></script>
<script src="data/characters.js"></script>
<script src="data/series.js"></script>
<script src="data/special.js"></script>
<script src="data/short.js"></script>
<script src="data/content.js"></script>
<script src="data/posters.js"></script>
<script src="data/stills.js"></script>
<script src="data/visuals.js"></script>
<script src="data/community.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>
<script>
(function () {
  var V2 = window.MCU.v2;
  MCU.ui.mount('index.html');

  /* ---------- Hero 星点（静态，无动画） ---------- */
  (function stars() {
    var box = document.getElementById('v2-stars');
    if (!box) return;
    var pos = [[8,14,2],[13,71,1.6],[21,44,2.6],[9,87,1.4],[27,21,1.8],
               [6,57,1.2],[33,79,2],[17,33,1.4],[24,8,1.8],[12,63,1.2]];
    box.innerHTML = pos.map(function (p) {
      var s = p[2];
      return '<span class="v2-star" style="top:' + p[0] + '%;left:' + p[1] + '%;width:' + s
           + 'px;height:' + s + 'px"></span>';
    }).join('');
  })();

  /* ---------- Hero 统计（动态取自数据，不硬编码） ---------- */
  (function stats() {
    var c = MCU.data.counts();
    var total = c.movie + c.series + c.special + c.short;
    var maxPhase = 0;
    MCU.data.all.forEach(function (m) { if (m.phase > maxPhase) maxPhase = m.phase; });
    setText('stat-count', total);
    setText('stat-routes', MCU.data.routes.length);
    setText('stat-phases', maxPhase);
  })();
  function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }

  /* ==========================================================
   * 模块 2：观影路线（电影卡片流）
   * 指令第五节：每个节点 = 海报 / 发布时间 / MCU 阶段 / 已观看状态
   * ========================================================== */
  var ROUTE_PICKS = ['newcomer', 'release', 'chrono'];
  var RAIL_CAP = 12;                       /* 首屏只渲染前 12 个节点，控制请求数 */
  var curRoute = ROUTE_PICKS[0];

  document.getElementById('routes-title').innerHTML = V2.sectionTitle({
    eyebrow: 'WATCH ORDER',
    title: '观影路线',
    sub: '选一条路线，按节点顺序看',
    moreHref: 'routes.html',
    moreText: '全部路线'
  });

  function renderRoutePills() {
    document.getElementById('route-pills').innerHTML = ROUTE_PICKS.map(function (id) {
      var r = MCU.data.routeById(id);
      if (!r) return '';
      var n = MCU.data.expandRoute(r).length;
      return '<button class="v2-pill' + (id === curRoute ? ' on' : '') + '" type="button" data-route="'
        + r.id + '">' + MCU.ui.esc(r.name) + ' · ' + n + ' 部</button>';
    }).join('');
  }

  function renderRoute() {
    var r = MCU.data.routeById(curRoute);
    if (!r) return;
    var list = MCU.data.expandRoute(r);
    var head = list.slice(0, RAIL_CAP);
    document.getElementById('route-rail').innerHTML = head.length
      ? head.map(function (m) { return V2.movieCard(m, { sub: 'date' }); }).join('')
      : '<div class="v2-empty">这条路线暂无内容</div>';

    var more = document.getElementById('route-more');
    /* V2.2 策划拍板 1A：本入口改指新的路线详情页体系（route-detail.html?id=…）。
       仅此一处 href 改动，首页结构/视觉/其他内容维持 V2.1 收口状态；
       routes.html（11 条路线总览）仍由区块标题「全部路线」与导航进入。 */
    more.href = 'route-detail.html?id=' + r.id;
    more.textContent = '查看「' + r.name + '」全部 ' + list.length + ' 部 →';
    if (list.length) {
      document.getElementById('route-pills').setAttribute('aria-label', r.tagline || r.name);
    }
  }

  document.getElementById('route-pills').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.v2-pill') : null;
    if (!b) return;
    curRoute = b.getAttribute('data-route');
    renderRoutePills();
    renderRoute();
  });

  renderRoutePills();
  renderRoute();

  /* ==========================================================
   * 模块 3：上映预告（漫威未来计划 · 时间轴）
   * 数据独立来源：data/upcoming.js → window.MCU_UPCOMING
   * ========================================================== */
  var UP = window.MCU_UPCOMING || [];
  document.getElementById('upcoming-title').innerHTML = V2.sectionTitle({
    eyebrow: 'WHAT\'S NEXT',
    title: '漫威未来计划',
    sub: UP.length ? '已公布的 ' + UP.length + ' 部未来作品' : '暂无已公布作品'
  });
  document.getElementById('upcoming-timeline').innerHTML = V2.timeline(UP);

  /* V2.1 推荐关注：委托点击，复用进度里的 想看 存储 */
  (function bindFollow() {
    var box = document.getElementById('upcoming-timeline');
    if (!box) return;
    box.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.v2-tl-follow') : null;
      if (!b) return;
      e.preventDefault();
      var id = b.getAttribute('data-follow');
      var on = MCU.progress.toggleWant(id);
      b.classList.toggle('is-on', on);
      b.textContent = on ? '已关注' : '关注';
      V2.toast(on ? '已关注该作品' : '已取消关注');
    });
  })();

  /* ==========================================================
   * 模块 4：电影资料库（阶段 + 类型筛选）
   * 指令第七节：卡片含 海报 / 名称 / MCU 阶段 / 推荐观看位置
   * ========================================================== */
  var LIB_CAP = 12;
  var libState = { phase: null, type: 'movie', limit: LIB_CAP };

  document.getElementById('library-title').innerHTML = V2.sectionTitle({
    eyebrow: 'LIBRARY',
    title: '电影资料库',
    sub: '按阶段浏览，点开看详情与观看关系'
  });

  function renderPhasePills() {
    var maxPhase = 0;
    MCU.data.all.forEach(function (m) { if (m.phase > maxPhase) maxPhase = m.phase; });
    var html = '<button class="v2-pill' + (libState.phase === null ? ' on' : '')
             + '" type="button" data-phase="all">全部阶段</button>';
    for (var p = 1; p <= maxPhase; p++) {
      html += '<button class="v2-pill' + (libState.phase === p ? ' on' : '')
            + '" type="button" data-phase="' + p + '">Phase ' + p + '</button>';
    }
    document.getElementById('phase-pills').innerHTML = html;
  }

  function renderTypePills() {
    var keys = ['movie', 'series', 'special', 'short', 'all'];
    var label = { movie: '电影', series: '剧集', special: '特别呈现', short: '短片', all: '全部类型' };
    document.getElementById('type-pills').innerHTML = keys.map(function (k) {
      return '<button class="v2-pill' + (libState.type === k ? ' on' : '')
           + '" type="button" data-type="' + k + '">' + label[k] + '</button>';
    }).join('');
  }

  function libList() {
    return MCU.data.all.filter(function (c) {
      if (libState.phase !== null && c.phase !== libState.phase) return false;
      if (libState.type !== 'all' && c.type !== libState.type) return false;
      return true;
    }).sort(function (a, b) { return a.ro - b.ro; });
  }

  function renderLibrary() {
    var list = libList();
    var slice = list.slice(0, libState.limit);
    document.getElementById('library-grid').innerHTML = slice.length
      ? slice.map(function (m) { return V2.movieCard(m, { sub: 'order' }); }).join('')
      : '<div class="v2-empty">当前筛选下没有内容</div>';

    var more = document.getElementById('library-more');
    if (list.length > libState.limit) {
      more.hidden = false;
      more.textContent = '展开更多（还有 ' + (list.length - libState.limit) + ' 部）';
    } else {
      more.hidden = true;
    }
  }

  function bindPills(id, attr, key) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('.v2-pill') : null;
      if (!b) return;
      var v = b.getAttribute(attr);
      libState[key] = (v === 'all') ? null : (key === 'phase' ? parseInt(v, 10) : v);
      if (key === 'type' && v === 'all') libState.type = 'all';
      libState.limit = LIB_CAP;
      renderPhasePills();
      renderTypePills();
      renderLibrary();
    });
  }

  document.getElementById('library-more').addEventListener('click', function () {
    libState.limit += LIB_CAP;
    renderLibrary();
  });

  renderPhasePills();
  renderTypePills();
  renderLibrary();
  bindPills('phase-pills', 'data-phase', 'phase');
  bindPills('type-pills', 'data-type', 'type');

  /* ==========================================================
   * 模块 5：我的 MCU
   * ========================================================== */
  document.getElementById('mine-title').innerHTML = V2.sectionTitle({
    eyebrow: 'MY MCU',
    title: '我的 MCU 记录',
    sub: '进度只存在这台设备，不上传'
  });

  function renderProgress() {
    document.getElementById('progress-card').innerHTML = V2.progressCard();
    var seenSlot = document.getElementById('seen-slot');
    if (seenSlot) seenSlot.innerHTML = V2.seenList();
    var achSlot = document.getElementById('ach-slot');
    if (achSlot) achSlot.innerHTML = V2.achievements();
    var btn = document.getElementById('clear-progress');
    if (btn) btn.onclick = function () {
      if (confirm('确定清空全部观影记录？此操作不可恢复。')) {
        MCU.progress.clear();
        renderProgress();
        renderMilestone();
        renderRoute();      /* 路线卡的已看状态同步刷新 */
        renderLibrary();
      }
    };
  }

  /* 里程碑（沿用 MCU.progress.checkMilestone()，仅换 V2 皮肤） */
  function renderMilestone() {
    var slot = document.getElementById('milestone-slot');
    if (!slot) return;
    var ms = MCU.progress.checkMilestone();
    if (!ms) { slot.innerHTML = ''; return; }
    slot.innerHTML = '<div class="v2-milestone">'
      + '<span class="v2-ms-badge">'
      +   '<svg viewBox="0 0 16 16" fill="none"><path d="M8 1l2.1 4.3 4.7.7-3.4 3.3.8 4.7L8 11.8 3.8 14l.8-4.7L1.2 6l4.7-.7L8 1z" fill="currentColor"/></svg>'
      +   '已看 ' + ms.n + ' 部'
      + '</span>'
      + '<div class="v2-ms-t">' + MCU.ui.esc(ms.title) + '</div>'
      + '<div class="v2-ms-d">' + MCU.ui.esc(ms.desc) + '</div>'
      + '<div class="v2-ms-actions">'
      +   '<button class="v2-btn v2-btn-primary" style="padding:8px 16px;font-size:13px" type="button"'
      +     ' data-mp-title="保存你的 MCU 旅程" data-mp-desc="已看、路线、收藏一起带走。">保存到小程序</button>'
      +   '<button class="v2-btn v2-btn-ghost" style="padding:8px 16px;font-size:13px" type="button" id="dismiss-milestone">稍后再说</button>'
      + '</div></div>';
    var d = document.getElementById('dismiss-milestone');
    if (d) d.onclick = function () { slot.innerHTML = ''; };
  }

  renderProgress();
  renderMilestone();

  /* ==========================================================
   * 模块 6：社区入口（点击仅提示，无发帖 / 评论 / 用户系统）
   * ========================================================== */
  document.getElementById('community-title').innerHTML = V2.sectionTitle({
    eyebrow: 'COMMUNITY',
    title: '漫威讨论区',
    sub: '社区即将开放'
  });
  document.getElementById('community-slot').innerHTML = V2.communityCard(window.MCU_COMMUNITY_TOPICS);

  (function bindCommunity() {
    var el = document.getElementById('v2-community');
    if (el) {
      var fire = function () { V2.toast('社区功能正在筹备中，欢迎关注。'); };
      el.addEventListener('click', fire);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); }
      });
    }
    /* V2.1 话题卡片：点击提示筹备中（不跳转、不虚构互动） */
    var wrap = document.getElementById('community-slot');
    if (wrap) wrap.addEventListener('click', function (e) {
      var t = e.target.closest ? e.target.closest('.v2-topic') : null;
      if (t) { e.preventDefault(); V2.toast('话题讨论即将开放，敬请期待。'); }
    });
  })();
})();
</script>
</body>
</html>
