/* 工具栏（替换原 .map-explorer-toolbar） */

.mx-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}

.mx-list{display:grid;gap:10px}

.mx-plain-link{color:var(--blue,#5D95E8);font-size:12px;text-decoration:none;white-space:nowrap;cursor:pointer}

.mx-overview-row{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel-2,#171f31);border:1px solid var(--border,#273043);border-radius:10px}

/* 保留：关系探索相关（.mx-hint / .mx-empty / .mx-return 由探索视图使用）*/
.mx-hint{margin-top:8px;font-size:11px;color:var(--text-3)}

<script>
(function(){

  function esc(s){return MCU.ui.esc(String(s==null?'':s));}
  function visual(m){return MCU.data.visual?MCU.data.visual(m.id):{poster:null,backdrop:null};}
  function phaseName(p){return {1:'第一阶段',2:'第二阶段',3:'第三阶段',4:'第四阶段',5:'第五阶段',6:'第六阶段'}[p]||'';}
  function phaseColor(m){return MCU.data.phaseColor?MCU.data.phaseColor(m.phase):'var(--gold)';}
  function statusOf(m){return m.date?'已上映':'即将上映';}
  function thumb(m){var v=visual(m);if(v.poster)return '<div class="thumb"><img src="'+esc(v.poster)+'" alt="《'+esc(m.cn)+'》海报" loading="lazy" onerror="this.style.display=\'none\';var s=this.nextElementSibling;if(s)s.style.display=\'\'"><div class="thumb-fallback" style="--c:'+phaseColor(m)+'">'+esc((m.cn||'作').slice(0,1))+'</div></div>';return '<div class="thumb"><div class="thumb-fallback" style="--c:'+phaseColor(m)+'">'+esc((m.cn||'作').slice(0,1))+'</div></div>';}

  /* A7：直接读 relation.type + 上映序 ro 判定方向，不依赖 why 文案 */
  function classifyRelations(m){
    var all=MCU.data.relationsOf(m.id)||[],before=[],after=[],direct=[];
    all.forEach(function(l){
      var o=MCU.data.get(l.other);if(!o)return;
      var label=(MCU.data.types[l.type]||{}).label||'关联';
      if(l.type==='setup'||l.type==='prereq'){(o.ro<m.ro?before:after).push({l:l,o:o,label:label});}
      else if(l.type==='sequel'){(o.ro>m.ro?after:before).push({l:l,o:o,label:label});}
      else direct.push({l:l,o:o,label:label});
    });
    before.sort(function(a,b){return b.l.weight-a.l.weight;});
    after.sort(function(a,b){return b.l.weight-a.l.weight;});
    direct.sort(function(a,b){return b.l.weight-a.l.weight;});
    return {before:before,after:after,direct:direct,all:all};
  }

  function relItem(x){
    var o=x.o,v=visual(o);
    var img=v.poster
      ? '<img src="'+esc(v.poster)+'" alt="《'+esc(o.cn)+'》海报" loading="lazy" onerror="this.style.display=\'none\';var s=this.nextElementSibling;if(s)s.style.display=\'\'"><div class="mx-rel-fallback" style="--c:'+phaseColor(o)+'">'+esc((o.cn||'作').slice(0,1))+'</div></div>'
      : '<div class="mx-rel-fallback" style="--c:'+phaseColor(o)+'">'+esc((o.cn||'作').slice(0,1))+'</div>';
    return '<div class="mx-rel"><div class="mx-rel-thumb">'+img+'</div>'
      +'<div><div class="mx-rel-name">《'+esc(o.cn)+'》</div>'
      +'<div class="mx-rel-meta">'+esc(o.year||'')+(o.type==='movie'&&o.phase?' · '+esc(phaseName(o.phase)):'')+' · '+esc((MCU.data.types[x.l.type]||{}).label||'关联')+'</div>'
      +'<div class="mx-why">'+esc(x.l.why||'暂无说明')+'</div>'
      +'<a class="mx-rel-link" href="movie.html?id='+encodeURIComponent(o.id)+'">查看作品详情 →</a></div></div>';
  }

  function flowSection(items,title){
    if(!items.length)return '<div class="mx-flow-section"><div class="mx-flow-empty">暂无明确的'+esc(title)+'关系，建议查看直接关联。</div></div>';
    return '<div class="mx-flow-section">'+items.slice(0,4).map(function(x){
      var tagCls=(x.l.type==='setup'||x.l.type==='prereq')?'mx-tag prereq':'mx-tag';
      return '<a class="mx-flow-item" href="movie.html?id='+encodeURIComponent(x.o.id)+'">'
        +thumb(x.o)
        +'<div><div class="mx-flow-name">'+esc(x.o.cn)+'</div>'
        +'<div class="mx-flow-meta">'+esc(x.o.year||'')+' · '+esc(x.label)+'</div>'
        +'<span class="'+tagCls+'">'+(title==='前置'?'推荐先看':'看完接着看')+'</span></div></a>';
    }).join('')+'</div>';
  }

  function renderExplore(m){

      +'</div></div></div>';

    var beforeCard='<div class="mx-card"><div class="mx-head"><div><h2>看这之前，建议先看</h2><div class="mx-sub">优先理解当前作品的关键前置</div></div></div>'+flowSection(r.before,'前置')+'</div>';
    var afterCard='<div class="mx-card"><div class="mx-head"><div><h2>看完之后，继续看什么</h2><div class="mx-sub">按现有关系数据展示后续线索</div></div></div>'+flowSection(r.after,'后续')+'</div>';
    var directHtml=r.direct.slice(0,8).map(relItem).join('');
    var directCard='<div class="mx-card full"><div class="mx-head"><div><h2>直接关联作品</h2><div class="mx-sub">先展示最重要的关系，再决定是否继续深入</div></div><div class="mx-count">共 '+r.direct.length+' 条</div></div>'+(directHtml?'<div class="mx-list">'+directHtml+'</div>':'<div class="mx-empty">暂未标注直接关联作品。</div>')+'</div>';

    var chars=(m.chars||[]).map(function(cid){
      var c=MCU.data.getChar?MCU.data.getChar(cid):null;if(!c)return '';
      var ap=MCU.data.charAppearances?MCU.data.charAppearances(cid):{count:0};
      var initial=(c.cn||'').split(' / ').pop().charAt(0);
      var charMid=(ap.list&&ap.list[0]&&ap.list[0].id)||'';
      var linkHtml=charMid
        ?'<a class="mx-plain-link" href="#" onclick="event.preventDefault();var s=document.getElementById(\'explore-select\');if(s){s.value=\''+charMid+'\';s.dispatchEvent(new Event(\'change\'));window.scrollTo({top:0,behavior:\'smooth\'});}">查看 →</a>'
        :'<span class="mx-plain-link" style="opacity:.4;cursor:default">查看 →</span>';
      return '<div class="mx-person"><div class="mx-person-left"><div class="mx-avatar">'+esc(initial)+'</div><div><div>'+esc(c.cn)+'</div><div style="font-size:11px;color:var(--text-3);margin-top:2px">出现 '+ap.count+' 部作品</div></div></div>'+linkHtml+'</div>';
    }).filter(Boolean).slice(0,5).join('');
    var charCard='<div class="mx-card"><div class="mx-head"><div><h2>相关角色</h2><div class="mx-sub">从角色继续探索作品轨迹</div></div></div>'+(chars?'<div class="mx-list">'+chars+'</div>':'<div class="mx-empty">暂无角色关系数据。</div>')+'</div>';

    var typeRows=Object.keys(MCU.data.types||{}).map(function(k){var n=r.all.filter(function(x){return x.type===k}).length;if(!n)return '';return '<div class="mx-overview-row"><span class="mx-overview-label">'+esc((MCU.data.types[k]||{}).label||'关联')+'</span><span class="mx-overview-count">'+n+' 条</span></div>';}).join('');
    var overviewCard='<div class="mx-card"><div class="mx-head"><div><h2>关系概览</h2><div class="mx-sub">这部作品与其他内容共有 '+r.all.length+' 条关系</div></div></div><div class="mx-list">'+(typeRows||'<div class="mx-empty">暂无关系数据。</div>')+'</div></div>';

    var panorama='<div class="mx-panorama">'
      +'<div class="mx-panorama-tag">MCU PANORAMA</div>'
      +'<div class="mx-panorama-title">想深入研究整个 MCU？</div>'
      +'<div class="mx-panorama-desc">一张完整、清晰的 MCU 六阶段电影全景图——一眼看懂整个宇宙的发展脉络。</div>'
      +'<button class="mx-panorama-btn" type="button" id="open-panorama">查看 MCU 全景图 →</button>'
      +'<div class="mx-panorama-hint">不用先搞懂所有关系，顺着"前置 → 当前 → 后续 → 直接关联"也能轻松完成探索。</div>'
      +'</div>';

    document.getElementById('explore-view').innerHTML=hero+'<div class="mx-grid">'+beforeCard+afterCard+directCard+charCard+overviewCard+'</div>'+panorama
      + '<button class="complain-inline" type="button" data-fb>'
      + '<svg viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
      + '发现信息有误？我要吐槽</button>';
    var b=document.getElementById('open-panorama');if(b)b.onclick=openPanorama;
  }

        id=q&&MCU.data.get(q)?q:((list.find(function(x){return x.type==='movie'})||list[0]||{}).id||'');
    if(id){sel.value=id;renderExplore(MCU.data.get(id));}

  function drawPanoConn(){
    if(!panoOverlay.classList.contains('show'))return;
    var ir=panoInner.getBoundingClientRect();
    panoSvg.setAttribute('width',ir.width);
    panoSvg.setAttribute('height',ir.height);
    panoSvg.innerHTML='';
    PANO_CONN.forEach(function(c){
      var from=panoInner.querySelector('.movie-card[data-id="'+c[0]+'"]');
      var to=panoInner.querySelector('.movie-card[data-id="'+c[1]+'"]');
      if(!from||!to)return;
      var fr=from.getBoundingClientRect(),tr=to.getBoundingClientRect();
      var x1=fr.left-ir.left+fr.width/2,y1=fr.top-ir.top+fr.height/2;
      var x2=tr.left-ir.left+tr.width/2,y2=tr.top-ir.top+tr.height/2;
      var type=c[2];
      if(type==='mainline'){
        var p=document.createElementNS('http://www.w3.org/2000/svg','path');
        var mx=(x1+x2)/2,my=Math.min(y1,y2)-15;
        p.setAttribute('d','M'+x1+','+y1+' Q'+mx+','+my+' '+x2+','+y2);
        p.setAttribute('class','conn-mainline');panoSvg.appendChild(p);
      }else if(type==='support'){
        var l=document.createElementNS('http://www.w3.org/2000/svg','line');
        l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
        l.setAttribute('class','conn-support');panoSvg.appendChild(l);
      }else{
        var dist=Math.abs(x2-x1),arcH=Math.min(dist*0.3,120),mx2=(x1+x2)/2,my2=Math.min(y1,y2)-arcH;
        var d='M'+x1+','+y1+' Q'+mx2+','+my2+' '+x2+','+y2;
        var g=document.createElementNS('http://www.w3.org/2000/svg','path');g.setAttribute('d',d);g.setAttribute('class','conn-cross-glow');panoSvg.appendChild(g);
        var p2=document.createElementNS('http://www.w3.org/2000/svg','path');p2.setAttribute('d',d);p2.setAttribute('class','conn-cross');panoSvg.appendChild(p2);
      }
    });
  }

  function buildPanorama(){
    panoInner.insertAdjacentHTML('beforeend',PANO_MOVIES.map(panoCardHTML).join(''));
    Array.prototype.forEach.call(panoInner.querySelectorAll('.movie-card'),function(el){
      el.addEventListener('click',function(){
        var id=el.getAttribute('data-id');
        if(id==='avengers-5'||id==='avengers-6')return;
        location.href='movie.html?id='+encodeURIComponent(id);
      });
    });
    document.getElementById('pano-close').addEventListener('click',closePanorama);
    var dragging=false,sx,sl;
    panoCanvas.addEventListener('mousedown',function(e){
      if(e.target.closest('.movie-card'))return;
      dragging=true;sx=e.pageX-panoCanvas.offsetLeft;sl=panoCanvas.scrollLeft;panoCanvas.classList.add('grabbing');
    });
    panoCanvas.addEventListener('mousemove',function(e){
      if(!dragging)return;e.preventDefault();
      var x=e.pageX-panoCanvas.offsetLeft;panoCanvas.scrollLeft=sl-(x-sx);
    });
    panoCanvas.addEventListener('mouseup',function(){dragging=false;panoCanvas.classList.remove('grabbing');});
    panoCanvas.addEventListener('mouseleave',function(){dragging=false;panoCanvas.classList.remove('grabbing');});
    panoCanvas.addEventListener('wheel',function(e){
      if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){panoCanvas.scrollLeft+=e.deltaY;}
    },{passive:true});
    document.addEventListener('keydown',function(e){
      if(e.key==='Escape'&&panoOverlay.classList.contains('show'))closePanorama();
    });
  }

  function openPanorama(){
    panoOverlay.classList.add('show');
    panoOverlay.setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    panoCanvas.scrollLeft=0;
    requestAnimationFrame(function(){drawPanoConn();});
    window.addEventListener('resize',drawPanoConn);
  }
  function closePanorama(){
    panoOverlay.classList.remove('show');
    panoOverlay.setAttribute('aria-hidden','true');
    document.body.style.overflow='';
    window.removeEventListener('resize',drawPanoConn);
  }

  document.getElementById('mode-explore').onclick=showExplore;
  buildPanorama();
  /* D8 场景5：全景图横向末端注入「地图延伸模块」（不遮挡地图、不破坏拖拽/缩放） */
  panoCanvas.insertAdjacentHTML('beforeend',
    MCU.ui.mpEntry({ variant: 'pano', title: '把你的观影轨迹留在这张地图上',
      desc: '六阶段，38 部电影。记录你看过的每一部，逐步点亮属于你的 MCU。', btnTxt: '开始点亮我的 MCU' }));
  populate();
  showExplore();
})();
</script>
