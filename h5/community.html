<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" href="assets/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>社区 - MCU 宇宙导航</title>
<meta name="description" content="MCU 观影社区：看完漫威电影和剧集，来这里聊聊观后感、阵容猜想与时间线。">
<meta name="keywords" content="漫威社区,MCU讨论,漫威观影感受,复仇者联盟5,漫威时间线讨论">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/v2.css">
<link rel="stylesheet" href="assets/css/v3-forum.css">
</head>
<body data-page="community">

<div id="app-nav"></div>

<main class="v3f">
  <!-- 紧凑 Hero -->
  <div class="v3f-hero">
    <div class="v3f-hero-left">
      <div class="v3f-hero-tag">COMMUNITY</div>
      <div class="v3f-hero-title">漫威讨论区</div>
      <div class="v3f-hero-sub">看完聊聊，才是完整的观影体验</div>
    </div>
    <button class="v3f-hero-btn" onclick="location.href='post-create.html'">+ 发帖</button>
  </div>

  <!-- 辅助入口双卡 -->
  <div class="v3f-hints">
    <a class="v3f-hint" href="next.html">
      <div class="v3f-hint-ico" style="background:var(--gold-soft)">
        <svg viewBox="0 0 24 24" fill="var(--gold)"><path d="M19 13l-7 7-7-7 1.41-1.41L11 16.17V4h2v12.17l4.59-4.58L19 13z"/></svg>
      </div>
      <div class="v3f-hint-txt">
        <div class="v3f-hint-b">下一部看什么</div>
        <div class="v3f-hint-d">按阶段/角色找路线</div>
      </div>
    </a>
    <a class="v3f-hint" href="map.html">
      <div class="v3f-hint-ico" style="background:var(--blue-soft)">
        <svg viewBox="0 0 24 24" fill="var(--blue)"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </div>
      <div class="v3f-hint-txt">
        <div class="v3f-hint-b">宇宙关系地图</div>
        <div class="v3f-hint-d">角色关系一图看懂</div>
      </div>
    </a>
  </div>

  <!-- 最新话题 -->
  <div class="v3f-sec-hd">
    <h2>最新话题</h2>
  </div>

  <div class="v3f-tabs">
    <button class="v3f-tab on" data-sort="latest">最新</button>
    <button class="v3f-tab" data-sort="hot">最热</button>
  </div>

  <div class="v3f-cats" id="v3f-cats">
    <button class="v3f-cat on" data-cat="">全部</button>
    <button class="v3f-cat" data-cat="movie">电影</button>
    <button class="v3f-cat" data-cat="series">剧集</button>
    <button class="v3f-cat" data-cat="char">角色</button>
    <button class="v3f-cat" data-cat="timeline">时间线</button>
    <button class="v3f-cat" data-cat="new">新作</button>
    <button class="v3f-cat" data-cat="general">闲聊</button>
  </div>

  <div id="v3f-list"></div>
</main>

<button class="v3f-fab" id="v3f-fab">+ 发帖</button>

<div id="app-foot"></div>

<script src="data/movies.js"></script>
<script src="data/upcoming.js"></script>
<script src="data/relations.js"></script>
<script src="data/routes.js"></script>

<script src="data/special.js"></script>
<script src="data/short.js"></script>
<script src="data/content.js"></script>
<script src="data/posters.js"></script>
<script src="data/stills.js"></script>
<script src="data/visuals.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/forum.js"></script>
</body>
</html>
