<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>MCU V1.2 电影详情预览 · 复仇者联盟</title>
<style>
  :root{
    --bg:#080B12; --surface-0:#0D1119; --surface-1:#161D2B; --surface-2:#1E2636; --surface-3:#2A3447;
    --gold:#F2B233; --gold-btn-text:#1A1206;
    --accent-blue:#4A9EF5; --accent-red:#E85D5D; --accent-purple:#9B7FE8;
    --accent-blue-a10:rgba(74,158,245,.10); --accent-blue-a20:rgba(74,158,245,.20);
    --accent-red-a10:rgba(232,93,93,.10); --accent-red-a20:rgba(232,93,93,.20);
    --accent-purple-a10:rgba(155,127,232,.10); --accent-purple-a20:rgba(155,127,232,.20);
    --p1:#5B8DEF; --p2:#28B487; --p3:#F0A932; --p4:#8B6FE8; --p5:#E8483F; --p6:#C25B8E;
    --p1-a60:rgba(91,141,239,.60); --p2-a60:rgba(40,180,135,.60); --p3-a60:rgba(240,169,50,.60);
    --p4-a60:rgba(139,111,232,.60); --p5-a60:rgba(232,72,63,.60); --p6-a60:rgba(194,91,142,.60);
    --text-main:#E8ECF4; --text-sub:#8E98AA; --text-weak:#555F73;
    --success:#3FB98A; --success-a20:rgba(63,185,138,.20);
    --white-a50:rgba(255,255,255,.50); --white-a70:rgba(255,255,255,.70);
    --gold-a06:rgba(242,178,51,.06); --gold-a10:rgba(242,178,51,.10); --gold-a12:rgba(242,178,51,.12);
    --gold-a15:rgba(242,178,51,.15); --gold-a20:rgba(242,178,51,.20); --gold-a50:rgba(242,178,51,.50); --gold-a60:rgba(242,178,51,.60);
    --shadow-hero:0 8rpx 32rpx rgba(0,0,0,.4); --glow-gold:0 8rpx 24rpx rgba(242,178,51,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#000;display:flex;justify-content:center;}
  .movie-page{width:375px;background:var(--bg);color:var(--text-main);font-family:-apple-system,"PingFang SC","Helvetica Neue",Helvetica,sans-serif;font-size:14px;line-height:1.5;padding-bottom:36px;}

  /* nav */
  .movie-nav-bar{display:flex;align-items:center;gap:10px;padding:10px 18px 6px;}
  .back-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chevron-left{width:8px;height:8px;border-left:2px solid var(--text-sub);border-bottom:2px solid var(--text-sub);transform:rotate(45deg);}
  .nav-label{font-size:12px;color:var(--text-sub);}

  /* hero */
  .movie-hero{position:relative;padding:18px 18px 28px;display:flex;gap:18px;}
  .hero-bg{position:absolute;inset:0;pointer-events:none;background-size:cover;background-position:center;}
  .poster{width:110px;height:160px;border-radius:8px;overflow:hidden;border:2px solid var(--gold-a20);flex-shrink:0;position:relative;z-index:1;}
  .poster img{width:100%;height:100%;display:block;object-fit:cover;}
  .hero-info{flex:1;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:1;min-width:0;}
  .hero-phase{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .hero-phase-dot{width:4px;height:16px;border-radius:2px;background:var(--p1);}
  .hero-phase-text{font-size:11px;color:var(--text-weak);}
  .hero-title{font-size:18px;font-weight:700;color:var(--text-main);line-height:1.3;margin-bottom:4px;}
  .hero-en{font-size:12px;color:var(--text-weak);margin-bottom:10px;}
  .hero-chips{display:flex;gap:5px;flex-wrap:wrap;}
  .chip{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid var(--surface-3);font-size:11px;color:var(--text-weak);}
  .chip.gold{color:var(--gold);border-color:var(--gold-a20);background:var(--gold-a06);}
  .chip.blue{color:var(--p1);border-color:var(--p1-a20);background:var(--p1-a06);}
  .watch-status{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;margin-top:10px;align-self:flex-start;background:var(--gold-a10);color:var(--gold);border:1px solid var(--gold-a20);}

  /* CTA */
  .movie-cta-section{padding:0 18px;margin-bottom:14px;}
  .movie-cta{width:100%;height:44px;font-size:18px;font-weight:700;border:none;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;background:var(--gold);color:var(--gold-btn-text);box-shadow:var(--glow-gold);}
  .ico-play{width:0;height:0;border-style:solid;border-width:7px 0 7px 12px;border-color:transparent transparent transparent var(--gold-btn-text);}

  /* resource */
  .resource-module{margin:0 18px 18px;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;overflow:hidden;}
  .resource-header{padding:14px;display:flex;align-items:center;gap:10px;}
  .resource-icon{width:32px;height:32px;background:var(--gold-a10);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--gold);flex-shrink:0;}
  .resource-info{flex:1;min-width:0;}
  .resource-title{font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:3px;}
  .resource-sub{font-size:11px;color:var(--text-weak);}
  .resource-pending{font-size:11px;color:var(--text-weak);opacity:.7;padding:0 14px 14px;}

  /* why */
  .why-section{margin:0 18px 18px;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:10px;padding:14px;}
  .why-label{font-size:12px;font-weight:600;color:var(--accent-blue);margin-bottom:6px;}
  .why-text{font-size:14px;color:var(--text-sub);line-height:1.7;}

  /* cast */
  .cast-section{margin:0 18px 18px;}
  .sequence-label{font-size:12px;font-weight:600;color:var(--text-weak);margin-bottom:10px;}
  .cast-row{display:flex;gap:14px;}
  .cast-card{flex:1;display:flex;flex-direction:column;align-items:center;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;padding:10px 6px;box-sizing:border-box;}
  .cast-avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;border:2px solid transparent;display:flex;align-items:center;justify-content:center;}
  .cast-initial{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--white-a70);}
  .cast-name{font-size:11px;font-weight:600;color:var(--text-main);margin-top:6px;text-align:center;}
  .cast-faction{font-size:11px;font-weight:400;margin-top:2px;text-align:center;}

  /* sequence */
  .sequence-section{padding:0 18px;margin-bottom:18px;}
  .sequence-row{display:flex;gap:10px;align-items:stretch;}
  .seq-card{flex:1;background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;}
  .seq-card.current{background:var(--gold-a10);border-color:var(--gold-a50);}
  .seq-poster{width:40px;height:60px;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .seq-poster img{width:100%;height:100%;object-fit:cover;display:block;}
  .seq-poster text,.seq-letter{font-size:14px;font-weight:800;color:var(--white-a50);}
  .seq-name{font-size:11px;color:var(--text-sub);line-height:1.3;}
  .seq-card.current .seq-name{color:var(--gold);font-weight:600;}
  .seq-role{font-size:11px;color:var(--text-weak);}
  .seq-arrow{display:flex;align-items:center;color:var(--text-weak);flex-shrink:0;}
  .chevron-right{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);}

  /* after */
  .after-section{margin:0 18px 28px;}
  .mark-watched-btn{width:100%;padding:14px 0;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--success);border:1px solid var(--success-a20);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;margin-bottom:14px;}
  .next-rec{background:var(--surface-2);border:1px solid var(--surface-3);border-radius:8px;padding:14px;display:flex;gap:14px;align-items:center;}
  .next-rec-poster{width:50px;height:72px;border-radius:4px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .next-rec-poster img{width:100%;height:100%;object-fit:cover;display:block;}
  .next-rec-info{flex:1;min-width:0;}
  .next-rec-label{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:4px;}
  .next-rec-title{font-size:14px;font-weight:600;color:var(--text-main);margin-bottom:3px;}
  .next-rec-desc{font-size:12px;color:var(--text-sub);line-height:1.4;}
  .next-rec-arrow{display:flex;align-items:center;color:var(--text-weak);flex-shrink:0;}

  /* faction */
  .fc-red{color:var(--accent-red);}.fc-blue{color:var(--accent-blue);}.fc-purple{color:var(--accent-purple);}.fc-gold{color:var(--gold);}.fc-gray{color:var(--text-weak);}
  .fring-red{border-color:var(--accent-red-a20);}.fring-blue{border-color:var(--accent-blue-a20);}.fring-purple{border-color:var(--accent-purple-a20);}.fring-gold{border-color:var(--gold-a20);}.fring-gray{border-color:var(--surface-3);}
  .fbg-red{background:linear-gradient(135deg,var(--accent-red),var(--accent-red-a60));}
  .fbg-blue{background:linear-gradient(135deg,var(--accent-blue),var(--accent-blue-a60));}
  .fbg-purple{background:linear-gradient(135deg,var(--accent-purple),var(--accent-purple-a60));}
  .fbg-gold{background:linear-gradient(135deg,var(--gold),var(--gold-a60));}
  .fbg-gray{background:var(--surface-3);}
  .poster-p1{background:linear-gradient(135deg,var(--p1),var(--p1-a60));}
  .poster-p2{background:linear-gradient(135deg,var(--p2),var(--p2-a60));}
  .poster-p3{background:linear-gradient(135deg,var(--p3),var(--p3-a60));}
</style>
</head>
<body>
<div class="movie-page">

  <div class="movie-nav-bar">
    <div class="back-btn"><div class="chevron-left"></div></div>
    <span class="nav-label">第一阶段</span>
  </div>

  <!-- Hero -->
  <div class="movie-hero">
    <div class="hero-bg" style="background-image:linear-gradient(160deg,rgba(91,141,239,.38) 0%,rgba(91,141,239,.12) 42%,#080B12 100%),url('https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/stills/avengers.jpg');"></div>
    <div class="poster"><img src="https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/posters/avengers.jpg" alt="复仇者联盟"></div>
    <div class="hero-info">
      <div class="hero-phase"><div class="hero-phase-dot"></div><span class="hero-phase-text">第一阶段 · 2012</span></div>
      <div class="hero-title">复仇者联盟</div>
      <div class="hero-en">The Avengers</div>
      <div class="hero-chips">
        <span class="chip gold">无限传奇</span>
        <span class="chip blue">必看</span>
        <span class="chip">电影</span>
      </div>
      <div class="watch-status">● 未观看</div>
    </div>
  </div>

  <!-- CTA -->
  <div class="movie-cta-section">
    <div class="movie-cta"><div class="ico-play"></div>开始观看</div>
  </div>

  <!-- resource -->
  <div class="resource-module">
    <div class="resource-header">
      <div class="resource-icon"><div class="ico-play"></div></div>
      <div class="resource-info"><div class="resource-title">观看资源</div><div class="resource-sub">想看时，资源会在这里</div></div>
    </div>
    <div class="resource-pending">观影资源正在整理中，敬请期待</div>
  </div>

  <!-- why -->
  <div class="why-section">
    <div class="why-label">为什么现在看这部</div>
    <div class="why-text">MCU 第一阶段的大团圆收束——六位初代英雄第一次并肩作战，此后所有跨角色联动都从这里开始。</div>
  </div>

  <!-- cast (M-08/M-09) -->
  <div class="cast-section">
    <div class="sequence-label">主要角色</div>
    <div class="cast-row">
      <div class="cast-card">
        <div class="cast-avatar fring-red fbg-red"><span class="cast-initial">钢</span></div>
        <div class="cast-name">钢铁侠</div><div class="cast-faction fc-red">复仇者</div>
      </div>
      <div class="cast-card">
        <div class="cast-avatar fring-red fbg-red"><span class="cast-initial">美</span></div>
        <div class="cast-name">美国队长</div><div class="cast-faction fc-red">复仇者</div>
      </div>
      <div class="cast-card">
        <div class="cast-avatar fring-blue fbg-blue"><span class="cast-initial">雷</span></div>
        <div class="cast-name">雷神</div><div class="cast-faction fc-blue">阿斯加德</div>
      </div>
      <div class="cast-card">
        <div class="cast-avatar fring-blue fbg-blue"><span class="cast-initial">黑</span></div>
        <div class="cast-name">黑寡妇</div><div class="cast-faction fc-blue">神盾局</div>
      </div>
    </div>
  </div>

  <!-- sequence -->
  <div class="sequence-section">
    <div class="sequence-label">观影位置</div>
    <div class="sequence-row">
      <div class="seq-card">
        <div class="seq-poster poster-p1"><img src="https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/posters/iron-man.jpg" alt="钢铁侠"></div>
        <div class="seq-name">钢铁侠</div><div class="seq-role">前一部</div>
      </div>
      <div class="seq-arrow"><div class="chevron-right"></div></div>
      <div class="seq-card current">
        <div class="seq-poster poster-p1"><img src="https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/posters/avengers.jpg" alt="复仇者联盟"></div>
        <div class="seq-name">复仇者联盟</div><div class="seq-role">当前</div>
      </div>
      <div class="seq-arrow"><div class="chevron-right"></div></div>
      <div class="seq-card">
        <div class="seq-poster poster-p1"><img src="https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/posters/iron-man-2.jpg" alt="钢铁侠2"></div>
        <div class="seq-name">钢铁侠2</div><div class="seq-role">下一部</div>
      </div>
    </div>
  </div>

  <!-- after -->
  <div class="after-section">
    <div class="mark-watched-btn">✓ 标记为已观看</div>
    <div class="next-rec">
      <div class="next-rec-poster poster-p2"><img src="https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/posters/age-of-ultron.jpg" alt="奥创纪元"></div>
      <div class="next-rec-info">
        <div class="next-rec-label">看完这部之后</div>
        <div class="next-rec-title">复仇者联盟2：奥创纪元</div>
        <div class="next-rec-desc">初代队伍的内部分歧第一次失控，直接铺垫了《内战》。</div>
      </div>
      <div class="next-rec-arrow"><div class="chevron-right"></div></div>
    </div>
  </div>

</div>
</body>
</html>
