# MCU 观影导航 H5 —— 独立站点（mcuatlas.xyz · 专属域名）
# ------------------------------------------------------------
# 用途：H5 生产站点，替代 mcu.yaokaixin.top（旧域直接下线）
# 落地路径：/www/server/panel/vhost/nginx/mcuatlas.xyz.conf
# 网站根：/www/wwwroot/mcu-h5   （与旧域同一份静态文件，无需改 H5 代码）
#
# ★ 证书要求（前置）：旧域证书(mcu.yaokaixin.top)不能用于新域，须为新域新申请。
#   申请 mcuatlas.xyz 的 DV 证书（阿里云免费「单域名」证书自动含 www），放到：
#     /www/server/panel/vhost/cert/mcuatlas.xyz/fullchain.pem
#     /www/server/panel/vhost/cert/mcuatlas.xyz/privkey.key
#   该证书覆盖 mcuatlas.xyz + www.mcuatlas.xyz；mcu.mcuatlas.xyz 仅在 80 做 301（不走 HTTPS，
#   因为免费单域名证书不含该三级子域）。旧域 mcu.yaokaixin.top 原证书继续保留，供其 CDN 资源域使用。
# ------------------------------------------------------------
# ★ V3.0 论坛 API 接入：/api/ 反代 → 127.0.0.1:8787（forum-api，systemd mcu-forum-api）
#   ^~ 前缀必须保留：否则 .html/.json 等正则 location 会截获 API 路径
# ------------------------------------------------------------

# 论坛 API 限流：单 IP 10 r/s，burst 20（API 内部另有用户级频率限制）
limit_req_zone $binary_remote_addr zone=forum_api:10m rate=10r/s;

# ---------- 80：全部主机名 301 → https://mcuatlas.xyz ----------
server
{
    listen 80;
    server_name mcuatlas.xyz www.mcuatlas.xyz mcu.mcuatlas.xyz;

    # ACME 校验位保留（便于 acme.sh 续签）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/mcu-h5;
    }

    location / {
        return 301 https://mcuatlas.xyz$request_uri;
    }

    access_log /www/wwwlogs/mcuatlas.xyz.log;
    error_log  /www/wwwlogs/mcuatlas.xyz.error.log;
}

# ---------- 443：主站 mcuatlas.xyz ----------
server
{
    listen 443 ssl;
    server_name mcuatlas.xyz;
    index index.html;
    root /www/wwwroot/mcu-h5;

    ssl_certificate     /www/server/panel/vhost/cert/mcuatlas.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcuatlas.xyz/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.html$  { add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.(css|js|json)$          { expires 7d;  add_header Cache-Control "public"; }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ { expires 30d; add_header Cache-Control "public"; }

    # ===== V3.0 论坛 API 反代：^~ 阻止下方正则 location 截获 =====
    location ^~ /api/ {
        limit_req zone=forum_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / { try_files $uri $uri.html $uri/ =404; }

    access_log /www/wwwlogs/mcuatlas.xyz.log;
    error_log  /www/wwwlogs/mcuatlas.xyz.error.log;
}

# ---------- 443：www 变体 301 → 非 www（证书含 www；mcu. 三级子域证书不含，仅 80 处理）----------
server
{
    listen 443 ssl;
    server_name www.mcuatlas.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/mcuatlas.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcuatlas.xyz/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://mcuatlas.xyz$request_uri;

    access_log /www/wwwlogs/mcuatlas.xyz.log;
    error_log  /www/wwwlogs/mcuatlas.xyz.error.log;
}
