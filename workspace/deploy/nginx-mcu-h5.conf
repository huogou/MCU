# ==========================================================
# MCU 观影导航 H5 —— Nginx 独立站点配置
# 适用：阿里云轻量应用服务器（Nginx）
# 特点：独立 server 块，不触碰博客任何配置
# ==========================================================
#
# 【使用方法】
#   1. 把 mcu.example.com 全部替换成你实际的 H5 子域名
#   2. 存到 /www/server/panel/vhost/nginx/mcu-h5.conf
#      （若不是宝塔，按服务器实际 conf.d 目录放）
#   3. nginx -t  检查语法
#   4. nginx -s reload  平滑重载（不影响博客）
# ==========================================================


# ---------- HTTP：先保证 80 能通，再配 HTTPS ----------
server {
    listen 80;
    server_name mcu.example.com;

    root /www/wwwroot/mcu-h5;
    index index.html;

    access_log /www/wwwlogs/mcu-h5.log;
    error_log  /www/wwwlogs/mcu-h5.error.log;

    # ---- gzip 压缩（若主配置已开 gzip，此处可删）----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 入口 HTML：短缓存，避免版本更新后用户拿旧页 ----
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 静态资源：长缓存（图片/JS/CSS 文件名不变）----
    location ~* \.(css|js|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ---- 多页面路由：.html 直返 200，无扩展名也能访问，不产生 308 ----
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}


