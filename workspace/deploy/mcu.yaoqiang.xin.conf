# MCU 观影导航 H5 —— 独立站点（临时域名 mcu.yaoqiang.xin）
# 纯静态，不碰博客；gzip 已在 nginx 主配置开启，此处不再重复
server
{
    listen 80;
    server_name mcu.yaoqiang.xin;

    index index.html;
    root /www/wwwroot/mcu-h5;

    access_log /www/wwwlogs/mcu.yaoqiang.xin.log;
    error_log  /www/wwwlogs/mcu.yaoqiang.xin.error.log;

    # 入口 HTML：不缓存，避免版本更新后用户长期拿旧页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 静态资源：长缓存
    location ~* \.(css|js|json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 多页面路由：.html 直返 200；无扩展名路径自动补 .html，不产生 308
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
