# MCU 观影导航 H5 —— 独立站点（mcu.yaokaixin.top）
# ------------------------------------------------------------
# 证书来源：阿里云 SSL 证书服务（免费 DV，DigiCert Encryption Everywhere DV TLS CA - G2）
#   SAN: mcu.yaokaixin.top, www.mcu.yaokaixin.top
#   有效期：2026-09-11 → 2026-12-09（约 89 天）
#   密钥类型：RSA
#   落地路径：/www/server/panel/vhost/cert/mcu.yaokaixin.top/{fullchain.pem,privkey.key}
#
# ★ 为什么证书放在「非 acme.sh 目录」：
#   acme.sh 的 renewal cron 会写回 /root/.acme.sh/<domain>_ecc/，
#   若把阿里云证书放进该目录，续签时会被 LE 证书静默覆盖 → 必须分开放。
#
# ★ 续签责任（与 LE 方案的关键差异）：
#   LE 时代由 acme.sh cron 全自动续签；改用阿里云证书后，
#   需在阿里云控制台开启该证书的「自动续签 + 自动部署到本服务器」，
#   或到期前手动重下证书并替换本目录两个文件后 nginx -s reload。
# ------------------------------------------------------------

server
{
    listen 80;
    server_name mcu.yaokaixin.top;

    # ACME 校验位保留（便于随时改回 Let's Encrypt 证书方案）
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/mcu-h5;
    }

    location / {
        return 301 https://mcu.yaokaixin.top$request_uri;
    }

    access_log /www/wwwlogs/mcu.yaokaixin.top.log;
    error_log  /www/wwwlogs/mcu.yaokaixin.top.error.log;
}

# www 变体（2026-09-11 启用）：统一 301 到非 www，保证 canonical 唯一
# ⚠ 前置条件：DNS 需存在 www.mcu.yaokaixin.top A 记录（三级域名，父级泛解析不覆盖）
server
{
    listen 80;
    server_name www.mcu.yaokaixin.top;

    location / {
        return 301 https://mcu.yaokaixin.top$request_uri;
    }

    access_log /www/wwwlogs/mcu.yaokaixin.top.log;
    error_log  /www/wwwlogs/mcu.yaokaixin.top.error.log;
}

server
{
    listen 443 ssl;
    server_name mcu.yaokaixin.top;
    index index.html;
    root /www/wwwroot/mcu-h5;

    ssl_certificate     /www/server/panel/vhost/cert/mcu.yaokaixin.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcu.yaokaixin.top/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # 同时保留 ECDSA 与 RSA 套件：当前证书为 RSA，ECDHE-RSA-* 生效；
    # 若日后换回 EC 证书无需改配置
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~* \.html$  { add_header Cache-Control "no-cache, must-revalidate"; }
    location ~* \.(css|js|json)$          { expires 7d;  add_header Cache-Control "public"; }
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ { expires 30d; add_header Cache-Control "public"; }

    location / { try_files $uri $uri.html $uri/ =404; }

    access_log /www/wwwlogs/mcu.yaokaixin.top.log;
    error_log  /www/wwwlogs/mcu.yaokaixin.top.error.log;
}

# www 的 HTTPS：证书 SAN 已含 www.mcu.yaokaixin.top，直接复用同一对证书
server
{
    listen 443 ssl;
    server_name www.mcu.yaokaixin.top;

    ssl_certificate     /www/server/panel/vhost/cert/mcu.yaokaixin.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mcu.yaokaixin.top/privkey.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://mcu.yaokaixin.top$request_uri;

    access_log /www/wwwlogs/mcu.yaokaixin.top.log;
    error_log  /www/wwwlogs/mcu.yaokaixin.top.error.log;
}
