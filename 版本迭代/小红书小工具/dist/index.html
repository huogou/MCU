<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>漫威宇宙导航</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }
  </style>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <button id="backBtn" class="icon-btn back-btn hidden" aria-label="返回">←</button>
      <div class="header-brand">
        <span class="brand-mark">🛡️</span>
        <h1 class="app-title">漫威宇宙导航</h1>
        <span class="brand-en">MCU&nbsp;ATLAS</span>
      </div>
      <div class="header-spacer"></div>
    </header>

    <main class="app-main" id="main">
      <!-- 首页 -->
      <section class="view home-view" id="homeView">
        <div class="hero">
          <div class="hero-badge">
            <span class="hero-icon">🛡️</span>
            <i class="ring ring-a"></i>
            <i class="ring ring-b"></i>
          </div>
          <h2 class="hero-title">探索漫威电影宇宙</h2>
          <p class="hero-subtitle">OFFLINE · MCU GUIDE · 离线可用</p>
        </div>
        <div class="menu-grid">
          <div class="menu-card" data-action="f1">
            <div class="menu-orb">
              <svg viewBox="0 0 24 24" class="menu-svg" aria-hidden="true">
                <rect x="2.5" y="5" width="19" height="14" rx="3" fill="none" stroke="#F2B233" stroke-width="1.8"/>
                <path d="M10 9.2 L15.5 12 L10 14.8 Z" fill="#F2B233"/>
              </svg>
            </div>
            <div class="menu-label">观影顺序</div>
            <div class="menu-desc">官方 / 时间线 / 入门路线</div>
            <span class="menu-code">01</span>
          </div>
          <div class="menu-card" data-action="f2">
            <div class="menu-orb">
              <svg viewBox="0 0 24 24" class="menu-svg" aria-hidden="true">
                <circle cx="5" cy="12" r="2.4" fill="none" stroke="#5865F2" stroke-width="1.8"/>
                <circle cx="19" cy="6" r="2.4" fill="none" stroke="#5865F2" stroke-width="1.8"/>
                <circle cx="19" cy="18" r="2.4" fill="none" stroke="#5865F2" stroke-width="1.8"/>
                <path d="M7.2 10.9 L16.8 7.1 M7.2 13.1 L16.8 16.9" stroke="#5865F2" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="menu-label">宇宙节点</div>
            <div class="menu-desc">角色与作品关系网</div>
            <span class="menu-code">02</span>
          </div>
          <div class="menu-card" data-action="f3">
            <div class="menu-orb">
              <svg viewBox="0 0 24 24" class="menu-svg" aria-hidden="true">
                <rect x="4" y="4" width="16" height="16" rx="4" fill="none" stroke="#E23C3C" stroke-width="1.8"/>
                <circle cx="9" cy="9" r="1.3" fill="#E23C3C"/>
                <circle cx="15" cy="15" r="1.3" fill="#E23C3C"/>
                <circle cx="15" cy="9" r="1.3" fill="#E23C3C"/>
                <circle cx="9" cy="15" r="1.3" fill="#E23C3C"/>
              </svg>
            </div>
            <div class="menu-label">随机探索</div>
            <div class="menu-desc">抽一部作品或角色</div>
            <span class="menu-code">03</span>
          </div>
          <div class="menu-card" data-action="f4">
            <div class="menu-orb">
              <svg viewBox="0 0 24 24" class="menu-svg" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="#4CD1A5" stroke-width="1.8"/>
                <circle cx="9" cy="10" r="1.8" fill="none" stroke="#4CD1A5" stroke-width="1.8"/>
                <path d="M4.8 17.6 L9.5 12.8 L13 16.2 L15.5 13.7 L19.2 17.6" stroke="#4CD1A5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="menu-label">分享卡片</div>
            <div class="menu-desc">生成漫威主题卡片</div>
            <span class="menu-code">04</span>
          </div>
        </div>
        <div class="home-footer-note">数据源自 MCU Atlas · 38 部院线电影</div>
      </section>

      <!-- F1 观影顺序 -->
      <section class="view f1-view hidden" id="f1View">
        <div class="view-head">
          <h2 class="view-title">观影顺序</h2>
          <p class="view-sub">选择一条观影路线</p>
        </div>
        <div class="route-list" id="routeList"></div>
        <div class="result-panel hidden" id="f1Result">
          <div class="result-header">
            <h3 id="f1RouteName"></h3>
            <p id="f1RouteDesc" class="secondary"></p>
          </div>
          <div class="content-list" id="f1ContentList"></div>
        </div>
      </section>

      <!-- F2 宇宙节点 -->
      <section class="view f2-view hidden" id="f2View">
        <div class="view-head">
          <h2 class="view-title">宇宙节点</h2>
          <p class="view-sub">搜索角色、作品或关键词</p>
        </div>
        <div class="search-bar">
          <input type="text" id="f2Search" placeholder="搜索角色、作品或关键词…" />
          <button id="f2SearchBtn" class="primary-btn">搜索</button>
        </div>
        <div class="filter-row" id="f2Filters">
          <button class="filter-btn active" data-filter="all">全部</button>
          <button class="filter-btn" data-filter="character">角色</button>
          <button class="filter-btn" data-filter="content">作品</button>
        </div>
        <div class="result-panel" id="f2Result">
          <div class="empty-tip" id="f2Empty">输入关键词开始探索宇宙节点</div>
          <div class="node-detail hidden" id="f2Detail"></div>
        </div>
      </section>

      <!-- F3 随机探索 -->
      <section class="view f3-view hidden" id="f3View">
        <div class="view-head">
          <h2 class="view-title">随机探索</h2>
          <p class="view-sub">把选择交给命运</p>
        </div>
        <div class="random-stage" id="f3Stage">
          <div class="random-card" id="f3Card">
            <i class="gem-ring"></i>
            <div class="random-icon">🎲</div>
            <div class="random-label">点击抽取你的下一次 MCU 之旅</div>
          </div>
        </div>
        <div class="random-actions">
          <button class="primary-btn" id="f3PickContent">随机作品</button>
          <button class="secondary-btn" id="f3PickCharacter">随机角色</button>
        </div>
        <div class="result-panel hidden" id="f3Result"></div>
      </section>

      <!-- F4 分享卡片 -->
      <section class="view f4-view hidden" id="f4View">
        <div class="view-head">
          <h2 class="view-title">分享卡片</h2>
          <p class="view-sub">生成你的漫威专属卡片</p>
        </div>
        <div class="card-preview-wrap">
          <canvas id="shareCanvas" width="900" height="1200"></canvas>
        </div>
        <div class="card-form">
          <label class="field-label">卡片标题（最多 20 字）</label>
          <input type="text" id="cardTitle" maxlength="20" placeholder="例如：漫威新手入坑路线" />
          <label class="field-label">一句话看点</label>
          <input type="text" id="cardLine" maxlength="40" placeholder="例如：12 部必看，从钢铁侠到终局之战" />
          <label class="field-label">副标题 / 署名</label>
          <input type="text" id="cardSub" maxlength="30" placeholder="漫威宇宙导航" value="漫威宇宙导航" />
          <div class="card-actions">
            <button class="primary-btn" id="genCardBtn">重新生成</button>
            <button class="secondary-btn" id="saveCardBtn">保存相册</button>
            <button class="secondary-btn" id="postCardBtn">发笔记</button>
          </div>
          <p class="tip" id="cardTip">离线预览下，保存 / 发笔记需在 App 内调用端能力。</p>
        </div>
      </section>
    </main>
  </div>

  <script src="./assets/data.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
