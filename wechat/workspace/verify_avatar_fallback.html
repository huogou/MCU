<!-- 头像 CDN 加载失败 → binderror 兜底机制验证页
     直接复刻小程序 5 页面 image+binderror+<text wx:else> 的运行时行为。
     故意用 broken URL 触发 img.onerror，验证 fallback text 显示。 -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Avatar Fallback Verify</title>
<style>
  body { background:#080B12; color:#E8ECF4; font-family:-apple-system,sans-serif; padding:24px; margin:0; }
  h1 { color:#F2B233; margin-top:32px; font-size:18px; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .card { background:#141925; border-radius:12px; padding:12px; text-align:center; }
  .avatar { width:60px; height:60px; border-radius:50%; overflow:hidden; margin:0 auto 8px; border:2px solid #E85D5D; display:flex; align-items:center; justify-content:center; }
  .avatar img { width:100%; height:100%; object-fit:cover; }
  .avatar .fallback { width:100%; height:100%; background:linear-gradient(135deg,#E85D5D,#7B2020); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; font-weight:700; }
  .name { font-size:13px; margin-top:4px; }
  .faction { font-size:11px; color:#A8B0C0; }
  .pass { color:#3FB98A; font-size:14px; }
  .fail { color:#E5604D; font-size:14px; }
  /* Hide <img> when errored; show .fallback */
  .card.errored img { display:none; }
  .card.errored .fallback { display:flex; }
  .card:not(.errored) .fallback { display:none; }
  .note { color:#6B7384; font-size:11px; margin-top:8px; font-style:italic; }
</style>
</head><body>
  <h1 style="color:#fff;font-size:22px">🛡️ V1.2 P0 — binderror 兜底机制验证</h1>
  <p>5 页面 image 加载失败时，自动回退到首字徽章（与 G-19 设计原则一致）</p>

  <h1>① 首页 热门角色（4 位）</h1>
  <div class="grid" id="home-grid"></div>

  <h1>② 角色图鉴 列表（4 个示例）</h1>
  <div class="grid" id="chars-grid"></div>

  <h1>③ 角色详情 Hero（钢铁侠）</h1>
  <div class="grid" id="char-detail-grid"></div>

  <h1>④ 关系探索 列表（3 个示例）</h1>
  <div class="grid" id="explore-grid"></div>

  <h1>⑤ 电影详情 主要角色（4 个示例）</h1>
  <div class="grid" id="movie-grid"></div>

  <h1 id="result">⏳ 验证中…</h1>

<script>
  // 真实 CDN URL（正常工作）— 应该显示 image
  const CDN = 'https://mcu-d6gw0brqoa9521b58-1307093647.tcloudbaseapp.com/assets/avatars';
  // 故意 broken URL — 模拟 CDN 异常情况，触发 fallback
  const BROKEN = 'https://invalid-cdn-test.example/avatars';

  function makeCard(id, name, cls, initial, useBroken) {
    const url = (useBroken ? BROKEN : CDN) + '/' + id + '.jpg';
    return `<div class="card" data-name="${name}">
      <div class="avatar" style="border-color:${cls}">
        <img src="${url}" onerror="this.parentNode.parentNode.classList.add('errored')" />
        <div class="fallback" style="background:linear-gradient(135deg,${cls},${cls}80);">${initial}</div>
      </div>
      <div class="name">${name}</div>
      <div class="faction">${id}</div>
    </div>`;
  }

  // ① 首页热门角色: tony/steve/thor/peter
  document.getElementById('home-grid').innerHTML =
    makeCard('tony','钢铁侠','#E85D5D','钢',true) +
    makeCard('steve','美国队长','#4A9EF5','美',true) +
    makeCard('thor','雷神','#F2B233','雷',true) +
    makeCard('peter','蜘蛛侠','#E85D5D','蛛',true);

  // ② 角色图鉴列表
  document.getElementById('chars-grid').innerHTML =
    makeCard('natasha','黑寡妇','#E85D5D','黑',true) +
    makeCard('tchalla','黑豹','#F2B233','黑',true) +
    makeCard('strange','奇异博士','#9B7FE8','奇',true) +
    makeCard('wanda','绯红女巫','#E85D5D','绯',true);

  // ③ 角色详情（单角色）
  document.getElementById('char-detail-grid').innerHTML = makeCard('tony','托尼·斯塔克','#E85D5D','钢',true);

  // ④ 关系探索
  document.getElementById('explore-grid').innerHTML =
    makeCard('loki','洛基','#4A9EF5','洛',true) +
    makeCard('bucky','冬兵','#4A9EF5','冬',true) +
    makeCard('gamora','卡魔拉','#9B7FE8','卡',true);

  // ⑤ 电影详情 主要角色
  document.getElementById('movie-grid').innerHTML =
    makeCard('clint','鹰眼','#E85D5D','鹰',true) +
    makeCard('hulk','浩克','#9B7FE8','浩',true) +
    makeCard('vision','幻视','#E85D5D','幻',true) +
    makeCard('wanda','旺达','#E85D5D','旺',true);

  // 等所有图片 onerror 完成，再统计
  setTimeout(() => {
    const all = document.querySelectorAll('.card');
    const errored = document.querySelectorAll('.card.errored');
    const valid = Array.from(all).filter(c => !c.classList.contains('errored'));
    const pct = (errored.length / all.length * 100).toFixed(1);
    document.getElementById('result').innerHTML = `✅ 验证完成：${errored.length}/${all.length} 头像成功 fallback (${pct}%)<br><span class="note">期望：100% 触发 fallback；上方所有卡片应显示首字徽章（钢/美/雷/蛛…），不应有破图</span>`;
    document.title = `Avatars ${errored.length}/${all.length} fallback`;
  }, 3000);
</script>
</body></html>
